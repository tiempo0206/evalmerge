[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalmerge"
version = "0.6.0"
description = "Local-first collaborative review tools for Inspect AI evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tiempo0206" }]
dependencies = [
  "inspect-ai>=0.3.264",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
evalmerge = "evalmerge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
